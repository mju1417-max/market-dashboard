name: pipeline-watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check market-dashboard status.json and alert via Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATUS_URL: https://mju1417-max.github.io/market-dashboard/data/status.json
          STALE_MIN: 35
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone

          url = os.environ["STATUS_URL"]
          stale_min = float(os.environ["STALE_MIN"])
          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()

          def send_tg(text: str):
              if not token or not chat_id:
                  print("TG_BOT_TOKEN or TG_CHAT_ID not set; skipping alert.")
                  return
              api = f"https://api.telegram.org/bot{token}/sendMessage"
              payload = json.dumps({"chat_id": chat_id, "text": text}).encode("utf-8")
              req = urllib.request.Request(api, data=payload, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  print("Telegram alert sent:", r.status)

          err = None
          data = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      if r.status != 200:
                          raise RuntimeError(f"HTTP {r.status}")
                      data = json.loads(r.read().decode("utf-8"))
                  break
              except Exception as e:
                  err = str(e)
                  time.sleep(5)

          if data is None:
              send_tg(f"🚨 [피클 장애 감지]\nstatus.json 접속 실패 (3회 재시도)\n사유: {err}")
              sys.exit(1)

          gen_at = data.get("generated_at")
          if not gen_at:
              send_tg("🚨 [피클 장애 감지]\nstatus.json에 generated_at 필드가 없습니다.")
              sys.exit(1)

          dt = datetime.fromisoformat(gen_at)
          age_min = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 60.0
          print(f"OK/CHECK: generated_at={gen_at}, age_min={age_min:.1f}")
          if age_min > stale_min:
              send_tg(f"🚨 [피클 수집 지연/중단]\n마지막 갱신: {gen_at}\n경과 시간: {age_min:.1f}분 (기준 {stale_min:.0f}분 초과)")
              sys.exit(1)
          PY
